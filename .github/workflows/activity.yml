name: Update GitHub Activity

on:
  push:
    branches:
      - main

  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate React Dark activity graph
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: Naperehvate
        shell: python
        run: |
          import os
          import json
          import urllib.request
          from pathlib import Path
          from datetime import datetime

          username = os.environ["USERNAME"]
          token = os.environ["GITHUB_TOKEN"]

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {"login": username}
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "github-activity-graph"
              }
          )

          with urllib.request.urlopen(request) as response:
              result = json.loads(response.read().decode("utf-8"))

          if "errors" in result:
              raise RuntimeError(result["errors"])

          weeks = result["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]

          days = []
          for week in weeks:
              for day in week["contributionDays"]:
                  days.append({
                      "date": day["date"],
                      "count": day["contributionCount"]
                  })

          days.sort(key=lambda item: item["date"])
          days = days[-30:]

          if not days:
              raise RuntimeError("GitHub returned no contribution data")

          width = 1120
          height = 390

          left = 62
          right = 28
          top = 92
          bottom = 64

          chart_width = width - left - right
          chart_height = height - top - bottom
          baseline = top + chart_height

          max_count = max(day["count"] for day in days)
          scale_max = max(max_count, 1)

          def x_position(index):
              if len(days) == 1:
                  return left
              return left + index * chart_width / (len(days) - 1)

          def y_position(value):
              return baseline - (value / scale_max) * chart_height

          points = [
              (x_position(i), y_position(day["count"]))
              for i, day in enumerate(days)
          ]

          def smooth_path(points):
              if len(points) < 2:
                  x, y = points[0]
                  return f"M {x:.2f} {y:.2f}"

              path = f"M {points[0][0]:.2f} {points[0][1]:.2f}"

              for i in range(len(points) - 1):
                  p0 = points[i - 1] if i > 0 else points[i]
                  p1 = points[i]
                  p2 = points[i + 1]
                  p3 = points[i + 2] if i + 2 < len(points) else p2

                  cp1x = p1[0] + (p2[0] - p0[0]) / 6
                  cp1y = p1[1] + (p2[1] - p0[1]) / 6

                  cp2x = p2[0] - (p3[0] - p1[0]) / 6
                  cp2y = p2[1] - (p3[1] - p1[1]) / 6

                  path += (
                      f" C {cp1x:.2f} {cp1y:.2f}"
                      f" {cp2x:.2f} {cp2y:.2f}"
                      f" {p2[0]:.2f} {p2[1]:.2f}"
                  )

              return path

          line_path = smooth_path(points)

          area_path = (
              line_path
              + f" L {points[-1][0]:.2f} {baseline:.2f}"
              + f" L {points[0][0]:.2f} {baseline:.2f} Z"
          )

          total = sum(day["count"] for day in days)
          active_days = sum(1 for day in days if day["count"] > 0)

          grid = []
          for i in range(5):
              value = scale_max * i / 4
              y = baseline - chart_height * i / 4

              grid.append(
                  f'<line x1="{left}" y1="{y:.2f}" '
                  f'x2="{width-right}" y2="{y:.2f}" '
                  f'stroke="#21262d" stroke-width="1"/>'
              )

              label = round(value)

              grid.append(
                  f'<text x="{left-14}" y="{y+4:.2f}" '
                  f'text-anchor="end" fill="#8b949e" '
                  f'font-size="11">{label}</text>'
              )

          date_labels = []
          for i, day in enumerate(days):
              if i % 2 != 0 and i != len(days) - 1:
                  continue

              x = x_position(i)

              date = datetime.strptime(
                  day["date"], "%Y-%m-%d"
              ).strftime("%d %b")

              date_labels.append(
                  f'<line x1="{x:.2f}" y1="{top}" '
                  f'x2="{x:.2f}" y2="{baseline}" '
                  f'stroke="#21262d" stroke-width="1" opacity="0.45"/>'
              )

              date_labels.append(
                  f'<text x="{x:.2f}" y="{baseline+28}" '
                  f'text-anchor="middle" fill="#8b949e" '
                  f'font-size="11">{date}</text>'
              )

          circles = []
          for i, day in enumerate(days):
              x, y = points[i]
              count = day["count"]
              date = datetime.strptime(
                  day["date"], "%Y-%m-%d"
              ).strftime("%d %b %Y")

              if count > 0:
                  radius = 3.6
                  fill = "#ffffff"
                  stroke = "#61dafb"
                  stroke_width = 2
                  opacity = "1"
                  glow = 'filter="url(#glow-strong)"'
              else:
                  radius = 2.1
                  fill = "#61dafb"
                  stroke = "#0d1117"
                  stroke_width = 1.2
                  opacity = "0.25"
                  glow = ""

              circles.append(
                  f'''
                  <circle
                    cx="{x:.2f}"
                    cy="{y:.2f}"
                    r="{radius}"
                    fill="{fill}"
                    stroke="{stroke}"
                    stroke-width="{stroke_width}"
                    opacity="{opacity}"
                    {glow}>
                    <title>{date}: {count} contributions</title>
                  </circle>
                  '''
              )

          svg = f'''<svg
            xmlns="http://www.w3.org/2000/svg"
            width="{width}"
            height="{height}"
            viewBox="0 0 {width} {height}"
            role="img">

            <title>GitHub Activity - Last 30 Days</title>

            <defs>
              <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#111821"/>
                <stop offset="100%" stop-color="#0d1117"/>
              </linearGradient>

              <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#61dafb" stop-opacity="0.30"/>
                <stop offset="65%" stop-color="#61dafb" stop-opacity="0.08"/>
                <stop offset="100%" stop-color="#61dafb" stop-opacity="0"/>
              </linearGradient>

              <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="2.5" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>

              <filter id="glow-strong" x="-60%" y="-60%" width="220%" height="220%">
                <feGaussianBlur stdDeviation="3.2" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <rect
              x="0"
              y="0"
              width="{width}"
              height="{height}"
              rx="8"
              fill="url(#background)"
            />

            <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

              <text
                x="{left}"
                y="34"
                fill="#c9d1d9"
                font-size="18"
                font-weight="600">
                GitHub Activity - Last 30 Days
              </text>

              <text
                x="{left}"
                y="59"
                fill="#8b949e"
                font-size="12">
                @{username} · {total} contributions · {active_days} active days
              </text>

              <g>
                {''.join(date_labels)}
                {''.join(grid)}
              </g>

              <path
                d="{area_path}"
                fill="url(#area)"
              />

              <path
                d="{line_path}"
                fill="none"
                stroke="#61dafb"
                stroke-width="2.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                filter="url(#glow)"
              />

              {''.join(circles)}

              <g transform="translate({width-128},34)">
                <line
                  x1="0"
                  y1="0"
                  x2="26"
                  y2="0"
                  stroke="#61dafb"
                  stroke-width="2.8"
                  stroke-linecap="round"
                />
                <text
                  x="35"
                  y="4"
                  fill="#8b949e"
                  font-size="12">
                  Daily
                </text>
              </g>

            </g>
          </svg>
          '''

          output = Path("activity-dist")
          output.mkdir(exist_ok=True)

          (output / "activity-30d.svg").write_text(
              svg,
              encoding="utf-8"
          )

          print("Generated activity-dist/activity-30d.svg")

      - name: Publish activity graph
        env:
          TARGET_BRANCH: activity-assets
        run: |
          set -euo pipefail

          temp_dir="$(mktemp -d)"
          cp -a activity-dist/. "$temp_dir/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --orphan "$TARGET_BRANCH"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          cp -a "$temp_dir"/. .

          git add -A
          git commit -m "Update GitHub activity graph" || echo "No changes"

          git push --force origin "$TARGET_BRANCH"
